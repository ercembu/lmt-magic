name: Refresh grades

# Three ways this runs, none of which need a PC:
#   - schedule: checks daily for a newly published set review
#   - workflow_dispatch: the "Run workflow" button, which works from the GitHub
#     mobile app, so you can trigger a full retrain from your phone
#   - push: rebuilds the published site when the code changes
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Retrain even if the review hasn't changed"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["web/**", "scripts/build_pwa.sh"]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Scryfall card data is 57MB and regenerable, so it is cached rather than
      # committed. A cache miss just re-fetches it.
      - name: Cache card data
        uses: actions/cache@v4
        with:
          path: data/cards
          key: cards-${{ hashFiles('scripts/fetch_scryfall.py') }}

      - name: Install deps
        run: pip install --quiet pandas scikit-learn lightgbm scipy

      - name: Fetch any missing card data
        run: python scripts/fetch_scryfall.py

      - name: Look for a published set review
        id: review
        run: |
          before=$(sha1sum data/expert/FRA.json 2>/dev/null | cut -d' ' -f1 || echo none)
          python scripts/expert_grades.py FRA || true
          after=$(sha1sum data/expert/FRA.json 2>/dev/null | cut -d' ' -f1 || echo none)
          echo "before=$before after=$after"
          if [ "$before" != "$after" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "changed=no" >> "$GITHUB_OUTPUT"
          fi

      # Retraining is only worth ~6 minutes of CI when the inputs actually moved.
      - name: Retrain and regrade
        if: steps.review.outputs.changed == 'yes'
        run: |
          python scripts/train.py
          python scripts/calibrate.py
          python scripts/predict.py FRA
          python scripts/signals.py FRA

      - name: Rebuild the published site
        run: bash scripts/build_pwa.sh FRA

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data/expert data/grades_FRA.json data/signals_FRA.json \
                     data/calibration.json data/validation.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh grades ($(date -u +%Y-%m-%d))"
            git push
          fi
